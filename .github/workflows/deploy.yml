# Setiap push ke main: tes rumus (Python & JS), build PWA, lalu terbitkan ke GitHub Pages.
# Aktifkan sekali: GitHub repo > Settings > Pages > Source: "GitHub Actions".
name: Uji & Terbitkan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cek kunci jawaban (Python)
        run: python analisis/deret_geometri.py
      - name: Uji API Python
        run: |
          pip install -q -r services/api/requirements.txt httpx pytest
          pytest -q services/api

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pasang paket
        run: npm ci
        working-directory: apps/web
      - name: Uji rumus & konten (JavaScript)
        run: npm test
        working-directory: apps/web
      - name: Build PWA
        run: npm run build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
