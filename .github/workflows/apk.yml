# Membuat aplikasi Android (APK) otomatis setiap ada perubahan di main.
# Hasil: Releases → "DeretKita APK" → DeretKita.apk
# Link unduh tetap: https://github.com/<pemilik>/<repo>/releases/latest/download/DeretKita.apk
name: Buat APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pasang paket
        run: npm ci

      - name: Uji rumus & konten
        run: npm test

      - name: Build web untuk APK
        run: npx vite build --mode apk && npx cap sync android
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Pasang kunci tanda tangan (dari GitHub Secret)
        working-directory: apps/web/android
        env:
          KUNCI: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KUNCI" ]; then
            echo "$KUNCI" | base64 -d > app/deretkita.keystore
            echo "Memakai kunci tetap DeretKita (APK bisa menimpa versi lama)."
          else
            echo "::warning::Secret APK_KEYSTORE_BASE64 belum diisi. APK memakai kunci sementara; untuk memasang versi baru, versi lama harus dihapus dulu."
          fi

      - name: Build APK
        working-directory: apps/web/android
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DeretKita.apk && ls -l DeretKita.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeretKita-apk
          path: apps/web/DeretKita.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: DeretKita APK (terbaru)
          make_latest: true
          files: apps/web/DeretKita.apk
          body: |
            Aplikasi Android DeretKita, versi build #${{ github.run_number }} (commit ${{ github.sha }}).

            **Cara pasang:** unduh `DeretKita.apk` di HP Android → buka → izinkan "Instal dari sumber tidak dikenal" → Instal.
            Versi baru bisa dipasang menimpa versi lama (data di HP tetap aman).
            Kak Deret: buka Pengaturan → Server Kak Deret, isi alamat server (laptop guru atau Render).
